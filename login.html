<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="SACHIN SHARMA">
<title>UPSC Aspirant Login & Card Portal | SACHIN SHARMA</title>

<link rel="icon" type="image/jpeg" href="https://files.catbox.moe/84df9j.jpg">
<link rel="apple-touch-icon" href="https://files.catbox.moe/84df9j.jpg">
<meta name="theme-color" content="#030712">

<!-- Supabase Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --bg: #030712;
    --card: #0f172a;
    --gold: #d97706;
    --primary: #f59e0b;
    --text: #f8fafc;
    --border: #1e293b;
    --err: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  body {
    background: radial-gradient(circle at top, #1e293b 0%, #030712 100%);
    color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .login-card {
    background: rgba(15, 23, 42, 0.95); border: 2px solid var(--gold); border-radius: 18px;
    width: 100%; max-width: 420px; padding: 24px 20px; box-shadow: 0 20px 45px rgba(0,0,0,0.8);
    text-align: center; backdrop-filter: blur(10px); position: relative;
  }
  .login-logo {
    width: 80px; height: auto; border-radius: 12px; border: 2px solid var(--gold);
    margin-bottom: 10px; background: #fff; padding: 2px;
  }
  h2 { font-size: 19px; font-family: Georgia, serif; color: var(--gold); margin-bottom: 4px; }
  .brand-sub { font-size: 11px; color: #ef4444; font-weight: 800; letter-spacing: 1.5px; margin-bottom: 16px; }
  
  .error-banner {
    display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid var(--err);
    color: #fca5a5; padding: 10px; border-radius: 8px; font-size: 12px; margin-bottom: 14px;
    text-align: left; font-weight: 600; line-height: 1.4;
  }
  .error-banner.show { display: block; animation: shake 0.3s ease; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  .auth-box { text-align: left; }
  .input-label { font-size: 11.5px; font-weight: 700; color: #cbd5e1; margin-bottom: 5px; display: block; }
  .auth-input {
    width: 100%; padding: 12px 14px; border-radius: 8px; border: 1.5px solid var(--border);
    margin-bottom: 14px; font-size: 14px; background: #030712; color: #fff; outline: none;
    transition: 0.2s border-color;
  }
  .auth-input:focus { border-color: var(--gold); }
  
  .btn-submit {
    width: 100%; padding: 14px; border-radius: 8px; background: linear-gradient(135deg, #d97706, #b45309);
    color: white; font-size: 14px; font-weight: bold; border: none; cursor: pointer;
    box-shadow: 0 4px 15px rgba(217, 119, 6, 0.4); text-transform: uppercase; letter-spacing: 1px;
    margin-top: 4px; display: block;
  }
  .btn-submit:active { transform: scale(0.97); }

  .toggle-text { margin-top: 16px; font-size: 12.5px; color: #94a3b8; text-align: center; }
  .toggle-text a { color: var(--gold); text-decoration: none; font-weight: bold; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="login-card">
  <img src="https://files.catbox.moe/84df9j.jpg" alt="Logo" class="login-logo">
  <h2>UPSC ASPIRANT PORTAL</h2>
  <div class="brand-sub">DEVELOPED BY SACHIN SHARMA · 𝚾 𝚫 𝚬 𝚸 · ༎🥀</div>

  <!-- ERROR NOTICE POPUP -->
  <div class="error-banner" id="errorBox"></div>

  <!-- HTML5 FORM FOR GUARANTEED SUBMISSION -->
  <form id="authForm" class="auth-box" onsubmit="event.preventDefault(); handleAuthAction();">
    <div id="registerOnlyFields">
      <label class="input-label">पूरा नाम (Candidate Full Name):</label>
      <input type="text" id="candName" class="auth-input" placeholder="उदा. सचिन शर्मा" autocomplete="name">

      <label class="input-label">लक्ष्य / संस्थान (Dream / Academy):</label>
      <input type="text" id="candDistrict" class="auth-input" placeholder="उदा. LBSNAA, Mussoorie">
    </div>

    <label class="input-label">मोबाइल नंबर (10-Digit Indian Mobile):</label>
    <input type="tel" id="candMobile" class="auth-input" placeholder="उदा. 98XXXXXXXX" maxlength="10" inputmode="numeric" autocomplete="tel">

    <label class="input-label">4-अंकों का गुप्त PIN (4-Digit PIN):</label>
    <input type="password" id="candPin" class="auth-input" placeholder="••••" maxlength="4" inputmode="numeric" style="letter-spacing: 4px; font-size: 18px;">

    <button type="submit" class="btn-submit" id="authBtn">सुरक्षित कार्ड बनाएँ एवं प्रवेश करें ➔</button>

    <div class="toggle-text">
      <span id="toggleQuestion">पहले से रजिस्टर्ड हैं?</span> 
      <a href="javascript:void(0)" onclick="toggleMode()" id="toggleBtn">यहाँ लॉगिन करें</a>
    </div>
  </form>
</div>

<script>
  const SUPABASE_URL = "https://prghkjmjbfqrzntpftct.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_0QygXoWgf2ixbz0AfEZy9g_F6Rcbuy7";
  
  let supabase = null;
  function getDbClient() {
    try {
      if (!supabase && window.supabase && typeof window.supabase.createClient === 'function') {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch(e) {}
    return supabase;
  }

  let isRegisterMode = true;

  function showError(msg) {
    const errBox = document.getElementById('errorBox');
    errBox.innerText = "⚠️ " + msg;
    errBox.classList.add('show');
    errBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function hideError() {
    const errBox = document.getElementById('errorBox');
    errBox.classList.remove('show');
    errBox.innerText = "";
  }

  function isValidIndianMobile(num) {
    return /^[6-9]\d{9}$/.test(num);
  }

  function toggleMode() {
    hideError();
    isRegisterMode = !isRegisterMode;
    const regFields = document.getElementById('registerOnlyFields');
    const authBtn = document.getElementById('authBtn');
    const toggleQ = document.getElementById('toggleQuestion');
    const toggleBtn = document.getElementById('toggleBtn');

    if (isRegisterMode) {
      regFields.classList.remove('hidden');
      authBtn.innerText = "सुरक्षित कार्ड बनाएँ एवं प्रवेश करें ➔";
      toggleQ.innerText = "पहले से रजिस्टर्ड हैं?";
      toggleBtn.innerText = "यहाँ लॉगिन करें";
    } else {
      regFields.classList.add('hidden');
      authBtn.innerText = "पोर्टल में लॉगिन करें ➔";
      toggleQ.innerText = "नया कार्ड बनाना चाहते हैं?";
      toggleBtn.innerText = "नया रजिस्ट्रेशन करें";
    }
  }

  function handleAuthAction() {
    hideError();
    const mobile = document.getElementById('candMobile').value.trim();
    const pin = document.getElementById('candPin').value.trim();
    const authBtn = document.getElementById('authBtn');

    // 1. Empty Check
    if (!mobile) {
      showError("कृपया अपना 10-अंकों का मोबाइल नंबर दर्ज करें! यह फ़ील्ड खाली नहीं हो सकती।");
      return;
    }
    // 2. Indian Mobile Validation
    if (!isValidIndianMobile(mobile)) {
      showError("अमान्य नंबर! कृपया एक वैध 10-अंकों का भारतीय मोबाइल नंबर दर्ज करें (शुरुआत 6, 7, 8 या 9 से होनी चाहिए)।");
      return;
    }
    // 3. PIN Check
    if (!pin) {
      showError("कृपया 4-अंकों का गुप्त PIN दर्ज करें! यह फ़ील्ड खाली नहीं हो सकती।");
      return;
    }
    if (pin.length !== 4 || isNaN(pin)) {
      showError("PIN अमान्य है! PIN केवल 4 अंकों की संख्या (उदा. 1234) होनी चाहिए।");
      return;
    }

    if (isRegisterMode) {
      const name = document.getElementById('candName').value.trim();
      const district = document.getElementById('candDistrict').value.trim() || "LBSNAA, Mussoorie";

      if (!name) {
        showError("कृपया अपना पूरा नाम दर्ज करें! यह फ़ील्ड खाली नहीं हो सकती।");
        return;
      }

      authBtn.innerText = "सत्यापन हो रहा है...";
      authBtn.disabled = true;

      const rollId = "UPSC-2027-" + Math.floor(1000 + Math.random() * 9000);
      const newUser = { mobile, pin, full_name: name, district, roll_id: rollId };

      // Local storage immediate save
      localStorage.setItem('upsc_logged_user', JSON.stringify(newUser));

      // Background Supabase Save
      const client = getDbClient();
      if (client) {
        client.from('aspirants').insert([newUser]).then(() => {}).catch(() => {});
      }

      // Instant Redirect
      setTimeout(() => {
        window.location.replace("index.html");
      }, 300);

    } else {
      // Login Check
      authBtn.innerText = "लॉगिन हो रहा है...";
      authBtn.disabled = true;

      const saved = localStorage.getItem('upsc_logged_user');
      if (saved) {
        try {
          const local = JSON.parse(saved);
          if (local.mobile === mobile) {
            if (local.pin === pin) {
              window.location.replace("index.html");
              return;
            } else {
              showError("गलत PIN दर्ज किया गया है! कृपया सही पिन दर्ज करें।");
              authBtn.innerText = "पोर्टल में लॉगिन करें ➔";
              authBtn.disabled = false;
              return;
            }
          }
        } catch(e) {}
      }

      // Online DB Fallback
      const client = getDbClient();
      if (client) {
        client.from('aspirants').select('*').eq('mobile', mobile).maybeSingle()
          .then(({ data: user }) => {
            if (user) {
              if (user.pin === pin) {
                localStorage.setItem('upsc_logged_user', JSON.stringify(user));
                window.location.replace("index.html");
              } else {
                showError("गलत PIN दर्ज किया गया है!");
                authBtn.innerText = "पोर्टल में लॉगिन करें ➔";
                authBtn.disabled = false;
              }
            } else {
              showError("यह मोबाइल नंबर नहीं मिला! कृपया 'नया रजिस्ट्रेशन करें' पर जाकर कार्ड बनाएँ।");
              toggleMode();
              authBtn.innerText = "सुरक्षित कार्ड बनाएँ एवं प्रवेश करें ➔";
              authBtn.disabled = false;
            }
          })
          .catch(() => {
            showError("नेटवर्क में देरी हो रही है, कृपया दोबारा प्रयास करें!");
            authBtn.innerText = "पोर्टल में लॉगिन करें ➔";
            authBtn.disabled = false;
          });
      } else {
        showError("उपयोगकर्ता नहीं मिला! कृपया पहले नया रजिस्ट्रेशन करें।");
        toggleMode();
        authBtn.innerText = "सुरक्षित कार्ड बनाएँ एवं प्रवेश करें ➔";
        authBtn.disabled = false;
      }
    }
  }

  // Already logged in check
  if (localStorage.getItem('upsc_logged_user')) {
    window.location.replace("index.html");
  }
</script>
</body>
</html>
