<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="SACHIN SHARMA">
<title>UPSC Aspirant Login & Card Portal | SACHIN SHARMA</title>

<link rel="icon" type="image/jpeg" href="https://files.catbox.moe/84df9j.jpg">
<link rel="apple-touch-icon" href="https://files.catbox.moe/84df9j.jpg">
<meta name="theme-color" content="#030712">

<!-- Supabase CDN Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --bg: #030712;
    --card: #0f172a;
    --gold: #d97706;
    --primary: #f59e0b;
    --text: #f8fafc;
    --border: #1e293b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  body {
    background: radial-gradient(circle at top, #1e293b 0%, #030712 100%);
    color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .login-card {
    background: rgba(15, 23, 42, 0.95); border: 2px solid var(--gold); border-radius: 18px;
    width: 100%; max-width: 420px; padding: 26px 22px; box-shadow: 0 20px 45px rgba(0,0,0,0.8);
    text-align: center; backdrop-filter: blur(10px);
  }
  .login-logo {
    width: 85px; height: auto; border-radius: 12px; border: 2px solid var(--gold);
    margin-bottom: 12px; background: #fff; padding: 2px;
  }
  h2 { font-size: 19px; font-family: Georgia, serif; color: var(--gold); margin-bottom: 4px; }
  .brand-sub { font-size: 11px; color: #ef4444; font-weight: 800; letter-spacing: 1.5px; margin-bottom: 18px; }
  
  .auth-box { text-align: left; }
  .input-label { font-size: 11.5px; font-weight: 700; color: #cbd5e1; margin-bottom: 5px; display: block; }
  .auth-input {
    width: 100%; padding: 12px 14px; border-radius: 8px; border: 1.5px solid var(--border);
    margin-bottom: 14px; font-size: 14px; background: #030712; color: #fff; outline: none;
    transition: 0.2s border-color;
  }
  .auth-input:focus { border-color: var(--gold); }
  
  .btn-submit {
    width: 100%; padding: 13px; border-radius: 8px; background: linear-gradient(135deg, #d97706, #b45309);
    color: white; font-size: 14px; font-weight: bold; border: none; cursor: pointer;
    box-shadow: 0 4px 15px rgba(217, 119, 6, 0.4); text-transform: uppercase; letter-spacing: 1px;
    margin-top: 6px;
  }
  .btn-submit:active { transform: scale(0.97); }

  .toggle-text { margin-top: 16px; font-size: 12.5px; color: #94a3b8; text-align: center; }
  .toggle-text a { color: var(--gold); text-decoration: none; font-weight: bold; }
  
  .hidden { display: none; }
</style>
</head>
<body>

<div class="login-card">
  <img src="https://files.catbox.moe/84df9j.jpg" alt="Logo" class="login-logo">
  <h2>UPSC ASPIRANT PORTAL</h2>
  <div class="brand-sub">DEVELOPED BY SACHIN SHARMA · 𝚾 𝚫 𝚬 𝚸 · ༎🥀</div>

  <div class="auth-box">
    <div id="registerOnlyFields">
      <label class="input-label">पूरा नाम (Candidate Full Name):</label>
      <input type="text" id="candName" class="auth-input" placeholder="उदा. सचिन शर्मा">

      <label class="input-label">लक्ष्य / संस्थान (Dream / Academy):</label>
      <input type="text" id="candDistrict" class="auth-input" placeholder="उदा. LBSNAA, Mussoorie">
    </div>

    <label class="input-label">मोबाइल नंबर (10-Digit Indian Mobile):</label>
    <input type="tel" id="candMobile" class="auth-input" placeholder="उदा. 98XXXXXXXX" maxlength="10">

    <label class="input-label">4-अंकों का गुप्त PIN (4-Digit PIN):</label>
    <input type="password" id="candPin" class="auth-input" placeholder="••••" maxlength="4" style="letter-spacing: 4px; font-size: 18px;">

    <button class="btn-submit" id="authBtn" onclick="handleAuthAction()">सुरक्षित कार्ड बनाएँ एवं प्रवेश करें ➔</button>

    <div class="toggle-text">
      <span id="toggleQuestion">पहले से रजिस्टर्ड हैं?</span> 
      <a href="javascript:void(0)" onclick="toggleMode()" id="toggleBtn">यहाँ लॉगिन करें</a>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://prghkjmjbfqrzntpftct.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_0QygXoWgf2ixbz0AfEZy9g_F6Rcbuy7";
  
  let supabase = null;
  try {
    if (window.supabase && typeof window.supabase.createClient === 'function') {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
  } catch(e) {}

  let isRegisterMode = true;

  function isValidIndianMobile(mobile) {
    return /^[6-9]\d{9}$/.test(mobile);
  }

  function toggleMode() {
    isRegisterMode = !isRegisterMode;
    const regFields = document.getElementById('registerOnlyFields');
    const authBtn = document.getElementById('authBtn');
    const toggleQ = document.getElementById('toggleQuestion');
    const toggleBtn = document.getElementById('toggleBtn');

    if (isRegisterMode) {
      regFields.classList.remove('hidden');
      authBtn.innerText = "सुरक्षित कार्ड बनाएँ एवं प्रवेश करें ➔";
      toggleQ.innerText = "पहले से रजिस्टर्ड हैं?";
      toggleBtn.innerText = "यहाँ लॉगिन करें";
    } else {
      regFields.classList.add('hidden');
      authBtn.innerText = "पोर्टल में लॉगिन करें ➔";
      toggleQ.innerText = "नया कार्ड बनाना चाहते हैं?";
      toggleBtn.innerText = "नया रजिस्ट्रेशन करें";
    }
  }

  async function handleAuthAction() {
    const mobile = document.getElementById('candMobile').value.trim();
    const pin = document.getElementById('candPin').value.trim();
    const authBtn = document.getElementById('authBtn');

    if (!isValidIndianMobile(mobile)) {
      alert("कृपया एक वैध 10-अंकों का भारतीय मोबाइल नंबर दर्ज करें (शुरुआत 6, 7, 8 या 9 से होनी चाहिए)!");
      return;
    }
    if (pin.length !== 4 || isNaN(pin)) {
      alert("कृपया 4-अंकों का गुप्त PIN दर्ज करें!");
      return;
    }

    authBtn.innerText = "प्रमाणित किया जा रहा है...";
    authBtn.disabled = true;

    if (isRegisterMode) {
      const name = document.getElementById('candName').value.trim();
      const district = document.getElementById('candDistrict').value.trim() || "LBSNAA, Mussoorie";

      if (!name) {
        alert("कृपया अपना पूरा नाम दर्ज करें!");
        authBtn.innerText = "सुरक्षित कार्ड बनाएँ एवं प्रवेश करें ➔";
        authBtn.disabled = false;
        return;
      }

      const rollId = "UPSC-2027-" + Math.floor(1000 + Math.random() * 9000);
      const newUser = { mobile, pin, full_name: name, district, roll_id: rollId };

      // Instant local persistence
      localStorage.setItem('upsc_logged_user', JSON.stringify(newUser));

      // Background Supabase Sync (Non-blocking)
      if (supabase) {
        supabase.from('aspirants').insert([newUser]).then(() => {}).catch(() => {});
      }

      window.location.replace("index.html");

    } else {
      // Login Check
      const saved = localStorage.getItem('upsc_logged_user');
      if (saved) {
        const local = JSON.parse(saved);
        if (local.mobile === mobile) {
          if (local.pin === pin) {
            window.location.replace("index.html");
            return;
          } else {
            alert("गलत PIN दर्ज किया गया है!");
            authBtn.innerText = "पोर्टल में लॉगिन करें ➔";
            authBtn.disabled = false;
            return;
          }
        }
      }

      // Online DB check fallback
      if (supabase) {
        try {
          const { data: user } = await supabase.from('aspirants').select('*').eq('mobile', mobile).maybeSingle();
          if (user) {
            if (user.pin === pin) {
              localStorage.setItem('upsc_logged_user', JSON.stringify(user));
              window.location.replace("index.html");
              return;
            } else {
              alert("गलत PIN दर्ज किया गया है!");
              authBtn.innerText = "पोर्टल में लॉगिन करें ➔";
              authBtn.disabled = false;
              return;
            }
          }
        } catch(e) {}
      }

      alert("उपयोगकर्ता नहीं मिला! कृपया पहले नया कार्ड बनाएँ।");
      toggleMode();
      authBtn.innerText = "सुरक्षित कार्ड बनाएँ एवं प्रवेश करें ➔";
      authBtn.disabled = false;
    }
  }

  // Already logged in check
  if (localStorage.getItem('upsc_logged_user')) {
    window.location.replace("index.html");
  }
</script>
</body>
</html>
