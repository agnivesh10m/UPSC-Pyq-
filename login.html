<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="SACHIN SHARMA">
<title>UPSC Aspirant Login & Card Portal | SACHIN SHARMA</title>

<link rel="icon" type="image/jpeg" href="https://files.catbox.moe/84df9j.jpg">
<link rel="apple-touch-icon" href="https://files.catbox.moe/84df9j.jpg">
<meta name="theme-color" content="#030712">

<style>
  :root {
    --bg: #030712;
    --card: #0f172a;
    --gold: #d97706;
    --primary: #f59e0b;
    --text: #f8fafc;
    --border: #1e293b;
    --err-bg: rgba(239, 68, 68, 0.2);
    --err-border: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  body {
    background: radial-gradient(circle at top, #1e293b 0%, #030712 100%);
    color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .login-card {
    background: rgba(15, 23, 42, 0.98); border: 2px solid var(--gold); border-radius: 18px;
    width: 100%; max-width: 420px; padding: 24px 20px; box-shadow: 0 20px 45px rgba(0,0,0,0.8);
    text-align: center; position: relative;
  }
  .login-logo {
    width: 80px; height: auto; border-radius: 12px; border: 2px solid var(--gold);
    margin-bottom: 10px; background: #fff; padding: 2px;
  }
  h2 { font-size: 19px; font-family: Georgia, serif; color: var(--gold); margin-bottom: 4px; }
  .brand-sub { font-size: 11px; color: #ef4444; font-weight: 800; letter-spacing: 1.5px; margin-bottom: 16px; }
  
  .notice-banner {
    display: block; background: rgba(217, 119, 6, 0.15); border: 1.5px solid var(--gold);
    color: #fde68a; padding: 10px 12px; border-radius: 8px; font-size: 12px; margin-bottom: 15px;
    text-align: left; font-weight: 500; line-height: 1.4;
  }

  .error-banner {
    display: none; background: var(--err-bg); border: 1.5px solid var(--err-border);
    color: #fca5a5; padding: 12px 14px; border-radius: 8px; font-size: 12.5px; margin-bottom: 15px;
    text-align: left; font-weight: 600; line-height: 1.5;
  }
  .error-banner.show { display: block; animation: shake 0.3s ease; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  .auth-box { text-align: left; }
  .input-label { font-size: 11.5px; font-weight: 700; color: #cbd5e1; margin-bottom: 5px; display: block; }
  .input-wrapper { position: relative; width: 100%; }
  .auth-input {
    width: 100%; padding: 12px 14px; border-radius: 8px; border: 1.5px solid var(--border);
    margin-bottom: 14px; font-size: 14px; background: #030712; color: #fff; outline: none;
    transition: 0.2s border-color;
  }
  .auth-input:focus { border-color: var(--gold); }
  
  .masked-mobile {
    -webkit-text-security: disc;
    letter-spacing: 2px;
  }

  .toggle-mask-btn {
    position: absolute; right: 12px; top: 12px; background: transparent;
    border: none; color: #94a3b8; font-size: 16px; cursor: pointer;
  }

  .btn-submit {
    width: 100%; padding: 14px; border-radius: 8px; background: linear-gradient(135deg, #d97706, #b45309);
    color: white; font-size: 14px; font-weight: bold; border: none; cursor: pointer;
    box-shadow: 0 4px 15px rgba(217, 119, 6, 0.4); text-transform: uppercase; letter-spacing: 1px;
    margin-top: 6px; display: block;
  }
  .btn-submit:active { transform: scale(0.97); }

  .toggle-text { margin-top: 16px; font-size: 12.5px; color: #94a3b8; text-align: center; }
  .toggle-text a { color: var(--gold); text-decoration: none; font-weight: bold; cursor: pointer; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="login-card">
  <img src="https://files.catbox.moe/84df9j.jpg" alt="Logo" class="login-logo">
  <h2>UPSC ASPIRANT PORTAL</h2>
  <div class="brand-sub">DEVELOPED BY SACHIN SHARMA · 𝚾 𝚫 𝚬 𝚸 · ༎🥀</div>

  <!-- WhatsApp Notice Banner -->
  <div class="notice-banner">
    📱 <b>महत्वपूर्ण सूचना:</b> कृपया लॉगिन या रजिस्ट्रेशन के लिए केवल वही मोबाइल नंबर दर्ज करें जो आपके सक्रिय <b>WhatsApp</b> से जुड़ा हो, ताकि ओटीपी (OTP) प्राप्त हो सके।
  </div>

  <div class="error-banner" id="noticeBox"></div>

  <!-- Chrome Password Manager के समर्थन के लिए autocomplete जोड़े गए हैं -->
  <form id="authForm" class="auth-box" autocomplete="on" onsubmit="event.preventDefault(); processAuth();">
    
    <!-- रजिस्ट्रेशन के लिए एक्स्ट्रा फील्ड्स -->
    <div id="registerOnlyFields">
      <label class="input-label">पूरा नाम (Candidate Full Name):</label>
      <input type="text" id="candName" class="auth-input" placeholder="उदा. सचिन शर्मा" autocomplete="name">

      <label class="input-label">लक्ष्य / संस्थान (Dream / Academy):</label>
      <input type="text" id="candDistrict" class="auth-input" placeholder="उदा. LBSNAA, Mussoorie" autocomplete="organization">
    </div>

    <label class="input-label">मोबाइल नंबर (10-Digit Indian Mobile):</label>
    <div class="input-wrapper">
      <input type="tel" id="candMobile" class="auth-input" placeholder="उदा. 98XXXXXXXX" maxlength="10" inputmode="numeric" autocomplete="username tel" style="padding-right: 42px;">
      <button type="button" class="toggle-mask-btn" onclick="toggleMobileMask()" id="maskIcon">👁️</button>
    </div>

    <label class="input-label">4-अंकों का गुप्त PIN (4-Digit PIN):</label>
    <input type="password" id="candPin" class="auth-input" placeholder="••••" maxlength="4" inputmode="numeric" autocomplete="current-password" style="letter-spacing: 4px; font-size: 18px;">

    <!-- OTP Field (Hidden Initially) -->
    <div id="otpFieldContainer" class="hidden">
      <label class="input-label" style="color: var(--primary);">WhatsApp पर भेजा गया 4-अंकों का OTP दर्ज करें:</label>
      <input type="text" id="otpInput" class="auth-input" placeholder="उदा. 4829" maxlength="4" inputmode="numeric" autocomplete="one-time-code" style="letter-spacing: 4px; font-size: 18px; border-color: var(--gold);">
    </div>

    <button type="submit" class="btn-submit" id="authBtn">व्हाट्सएप पर OTP भेजें ➔</button>

    <div class="toggle-text" id="toggleContainer">
      <span id="toggleQuestion">पहले से रजिस्टर्ड हैं?</span> 
      <a onclick="toggleAuthMode()" id="toggleBtn">यहाँ लॉगिन करें</a>
    </div>
  </form>
</div>

<script>
  const SB_URL = "https://prghkjmjbfqrzntpftct.supabase.co";
  const SB_KEY = "sb_publishable_0QygXoWgf2ixbz0AfEZy9g_F6Rcbuy7";
  const RENDER_API_URL = "https://otp-07dc.onrender.com"; // Render WhatsApp OTP Service

  let isRegisterMode = true;
  let isOtpSentState = false;

  function toggleMobileMask() {
    const mobInput = document.getElementById('candMobile');
    const maskIcon = document.getElementById('maskIcon');
    if (mobInput.classList.contains('masked-mobile')) {
      mobInput.classList.remove('masked-mobile');
      maskIcon.innerText = "👁️";
    } else {
      mobInput.classList.add('masked-mobile');
      maskIcon.innerText = "🙈";
    }
  }

  function showNotice(text) {
    const box = document.getElementById('noticeBox');
    box.innerHTML = "⚠️ " + text;
    box.classList.add('show');
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function hideNotice() {
    const box = document.getElementById('noticeBox');
    box.classList.remove('show');
    box.innerHTML = "";
  }

  function isValidIndianMobile(num) {
    return /^[6-9]\d{9}$/.test(num);
  }

  function toggleAuthMode() {
    hideNotice();
    isRegisterMode = !isRegisterMode;
    isOtpSentState = false;
    
    const regFields = document.getElementById('registerOnlyFields');
    const authBtn = document.getElementById('authBtn');
    const toggleQ = document.getElementById('toggleQuestion');
    const toggleBtn = document.getElementById('toggleBtn');
    const otpContainer = document.getElementById('otpFieldContainer');
    const mobileInput = document.getElementById('candMobile');
    const pinInput = document.getElementById('candPin');

    otpContainer.classList.add('hidden');
    mobileInput.disabled = false;
    pinInput.disabled = false;

    if (isRegisterMode) {
      regFields.classList.remove('hidden');
      authBtn.innerText = "व्हाट्सएप पर OTP भेजें ➔";
      toggleQ.innerText = "पहले से रजिस्टर्ड हैं?";
      toggleBtn.innerText = "यहाँ लॉगिन करें";
    } else {
      regFields.classList.add('hidden');
      authBtn.innerText = "व्हाट्सएप पर OTP भेजें ➔";
      toggleQ.innerText = "नया कार्ड बनाना चाहते हैं?";
      toggleBtn.innerText = "नया रजिस्ट्रेशन करें";
    }
  }

  async function syncToSupabase(userObj) {
    try {
      await fetch(`${SB_URL}/rest/v1/aspirants`, {
        method: "POST",
        headers: {
          "apikey": SB_KEY,
          "Authorization": `Bearer ${SB_KEY}`,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify(userObj)
      });
    } catch(err) {
      console.log("DB sync error", err);
    }
  }

  async function checkUserInSupabase(mobile) {
    try {
      const res = await fetch(`${SB_URL}/rest/v1/aspirants?mobile=eq.${mobile}&select=*`, {
        headers: {
          "apikey": SB_KEY,
          "Authorization": `Bearer ${SB_KEY}`
        }
      });
      if (res.ok) {
        const data = await res.json();
        return (data && data.length > 0) ? data[0] : null;
      }
    } catch(e) {}
    return null;
  }

  async function processAuth() {
    hideNotice();
    const mobile = document.getElementById('candMobile').value.trim();
    const pin = document.getElementById('candPin').value.trim();
    const authBtn = document.getElementById('authBtn');

    if (!mobile) {
      showNotice("<b>मोबाइल नंबर अनिवार्य है!</b> कृपया 10-अंकों का नंबर दर्ज करें।");
      return;
    }
    if (!isValidIndianMobile(mobile)) {
      showNotice("<b>अमान्य मोबाइल नंबर!</b> कृपया एक वैध 10-अंकों का भारतीय नंबर दर्ज करें (शुरुआत 6, 7, 8 या 9 से होनी चाहिए)।");
      return;
    }

    if (!pin) {
      showNotice("<b>PIN अनिवार्य है!</b> कृपया अपना 4-अंकों का गुप्त PIN दर्ज करें।");
      return;
    }
    if (pin.length !== 4 || isNaN(pin)) {
      showNotice("<b>PIN अमान्य है!</b> PIN केवल 4 अंकों की संख्या होनी चाहिए (उदा. 1234)।");
      return;
    }

    // यदि लॉगिन मोड है, तो पहले चेक कर लें कि क्या यह नंबर डेटाबेस में रजिस्टर है या नहीं
    if (!isRegisterMode && !isOtpSentState) {
      authBtn.innerText = "खाता जाँच जा रहा है...";
      authBtn.disabled = true;

      const dbUser = await checkUserInSupabase(mobile);
      if (!dbUser) {
        showNotice("<b>खाता नहीं मिला!</b> यह मोबाइल नंबर पंजीकृत नहीं है। कृपया पहले 'नया रजिस्ट्रेशन' करें।");
        authBtn.innerText = "व्हाट्सएप पर OTP भेजें ➔";
        authBtn.disabled = false;
        return;
      }
      if (dbUser.pin !== pin) {
        showNotice("<b>गलत PIN!</b> दर्ज किया गया 4-अंकों का PIN सही नहीं है।");
        authBtn.innerText = "व्हाट्सएप पर OTP भेजें ➔";
        authBtn.disabled = false;
        return;
      }
    }

    // चरण 1: व्हाट्सएप पर ओटीपी भेजने का प्रोसेस
    if (!isOtpSentState) {
      authBtn.innerText = "WhatsApp पर OTP भेजा जा रहा है...";
      authBtn.disabled = true;

      try {
        const response = await fetch(`${RENDER_API_URL}/send-otp`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone: mobile })
        });
        const result = await response.json();

        if (response.ok && result.success) {
          isOtpSentState = true;
          authBtn.innerText = "OTP वेरीफाई करें एवं प्रवेश करें ➔";
          authBtn.disabled = false;
          
          document.getElementById('otpFieldContainer').classList.remove('hidden');
          document.getElementById('candMobile').disabled = true;
          document.getElementById('candPin').disabled = true;
          document.getElementById('registerOnlyFields').classList.add('hidden');
          document.getElementById('toggleContainer').classList.add('hidden');
          
          showNotice("<b>सफलता!</b> आपके WhatsApp नंबर पर 4-अंकों का OTP भेज दिया गया है। कृपया नीचे दर्ज करें।");
          document.getElementById('noticeBox').style.background = "rgba(16, 185, 129, 0.2)";
          document.getElementById('noticeBox').style.borderColor = "#10b981";
          document.getElementById('noticeBox').style.color = "#6ee7b7";
        } else {
          showNotice(result.message || "WhatsApp पर OTP भेजने में विफल। कृपया सुनिश्चित करें कि नंबर सक्रिय है।");
          authBtn.innerText = "व्हाट्सएप पर OTP भेजें ➔";
          authBtn.disabled = false;
        }
      } catch (err) {
        showNotice("<b>सर्वर एरर!</b> Render व्हाट्सएप सर्वर से कनेक्ट नहीं हो पा रहा है। कृपया कुछ देर बाद कोशिश करें।");
        authBtn.innerText = "व्हाट्सएप पर OTP भेजें ➔";
        authBtn.disabled = false;
      }
      return;
    }

    // चरण 2: ओटीपी वेरीफाई करना (यह सुनिश्चित करता है कि बिना ओटीपी के कभी एंट्री न हो)
    const otp = document.getElementById('otpInput').value.trim();
    if (!otp || otp.length !== 4) {
      showNotice("<b>OTP अनिवार्य है!</b> कृपया WhatsApp पर प्राप्त 4-अंकों का OTP दर्ज करें।");
      return;
    }

    authBtn.innerText = "OTP सत्यापन हो रहा है...";
    authBtn.disabled = true;

    try {
      const verifyRes = await fetch(`${RENDER_API_URL}/verify-otp`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone: mobile, otp: otp })
      });
      const verifyResult = await verifyRes.json();

      if (!verifyRes.ok || !verifyResult.success) {
        showNotice("<b>गलत OTP!</b> कृपया सही 4-अंकों का OTP दर्ज करें।");
        authBtn.innerText = "OTP वेरीफाई करें एवं प्रवेश करें ➔";
        authBtn.disabled = false;
        return;
      }

      // ओटीपी सौ प्रतिशत सही है, अब आगे की प्रक्रिया पूरी होगी
      if (isRegisterMode) {
        const name = document.getElementById('candName').value.trim();
        const district = document.getElementById('candDistrict').value.trim() || "LBSNAA, Mussoorie";

        if (!name) {
          showNotice("<b>पूरा नाम अनिवार्य है!</b> कृपया अपना नाम दर्ज करें।");
          authBtn.innerText = "OTP वेरीफाई करें एवं प्रवेश करें ➔";
          authBtn.disabled = false;
          return;
        }

        const rollId = "UPSC-2027-" + Math.floor(1000 + Math.random() * 9000);
        const newUser = { mobile, pin, full_name: name, district, roll_id: rollId };

        localStorage.setItem('upsc_logged_user', JSON.stringify(newUser));
        await syncToSupabase(newUser);

        setTimeout(() => {
          window.location.replace("index.html");
        }, 300);

      } else {
        // लॉगिन मोड: डेटाबेस से यूजर की पूरी जानकारी फेच करके सेव करेंगे
        const dbUser = await checkUserInSupabase(mobile);
        if (dbUser) {
          localStorage.setItem('upsc_logged_user', JSON.stringify(dbUser));
        } else {
          // अगर लोकल या सेशन में हो तो बैकअप
          const fallbackUser = { mobile, pin, full_name: "UPSC Aspirant", district: "LBSNAA, Mussoorie", roll_id: "UPSC-2027-" + Math.floor(1000 + Math.random() * 9000) };
          localStorage.setItem('upsc_logged_user', JSON.stringify(fallbackUser));
        }

        setTimeout(() => {
          window.location.replace("index.html");
        }, 300);
      }

    } catch (err) {
      showNotice("<b>एरर!</b> सत्यापन के दौरान तकनीकी समस्या आ गई। कृपया पुनः प्रयास करें।");
      authBtn.innerText = "OTP वेरीफाई करें एवं प्रवेश करें ➔";
      authBtn.disabled = false;
    }
  }
</script>
</body>
</html>
