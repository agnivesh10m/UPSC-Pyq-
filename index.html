<!-- PWA Manifest & Icons -->

<style>
  :root { --bg: #f3f0e8; --card: #ffffff; --text: #18263a; --primary: #1b3552; --gold: #c5a15b; --border: #e6dfd1; }
  body.dark-mode { --bg: #090e17; --card: #111926; --text: #f8fafc; --primary: #3b82f6; --gold: #fbbf24; --border: #1e293b; }
  
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
  body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
  
  /* Splash Screen / Loading Animation */
  #splashScreen {
    position: fixed; inset: 0; background: #0d192b; z-index: 999999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: white; transition: opacity 0.5s ease;
  }
  #splashScreen img {
    width: 130px; height: auto; max-height: 140px; object-fit: contain;
    border-radius: 12px; border: 2px solid var(--gold); box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    margin-bottom: 20px; animation: pulseLogo 1.5s infinite alternate;
  }
  @keyframes pulseLogo { 0% { transform: scale(0.95); } 100% { transform: scale(1.05); } }
  .loader-bar { width: 140px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden; margin-top: 15px; }
  .loader-bar::after { content: ''; display: block; width: 40%; height: 100%; background: var(--gold); animation: loadAnim 1s infinite alternate; }
  @keyframes loadAnim { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }

  /* Full Screen Host Frame Container */
  .fullscreen-container {
    width: 100vw; height: 100vh; display: flex; flex-direction: column;
  }
  
  /* Top Minimal Brand Bar */
  .top-brand-bar {
    background: #0d192b; color: white; padding: 8px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid var(--gold); font-size: 13px; z-index: 10;
  }
  .top-brand-bar a { color: #f7e6bd; text-decoration: none; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; }
  .top-brand-bar button { background: rgba(255,255,255,0.2); border: none; color: white; padding: 4px 10px; border-radius: 15px; cursor: pointer; font-size: 11px; font-weight: bold; }

  .fullscreen-iframe-box {
    flex: 1; width: 100%; background: #fff;
  }
  .fullscreen-iframe-box iframe {
    width: 100%; height: 100%; border: none;
  }

  /* 30-Second Multi-Color Fading SACHIN SHARMA Watermark Overlay */
  @keyframes sachin30sCycle {
    0%    { color: rgba(236, 72, 153, 0.32); opacity: 1; }
    13%   { color: rgba(239, 68, 68, 0.32);  opacity: 1; }
    26%   { color: rgba(15, 23, 42, 0.35);   opacity: 1; }
    40%   { color: rgba(37, 99, 235, 0.32);  opacity: 1; }
    53%   { color: rgba(249, 115, 22, 0.32); opacity: 1; }
    68%   { color: rgba(190, 200, 215, 0.38);opacity: 1; }
    80%   { opacity: 0; }
    93%   { opacity: 0; }
    100%  { color: rgba(236, 72, 153, 0.32); opacity: 1; }
  }

  .sachin-grid-watermark {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    grid-template-rows: repeat(auto-fill, minmax(170px, 1fr));
    pointer-events: none; z-index: 99999; overflow: hidden; user-select: none;
  }
  .sachin-grid-cell {
    display: flex; align-items: center; justify-content: center;
    font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 900;
    letter-spacing: 4px; transform: rotate(-24deg); white-space: nowrap;
    animation: sachin30sCycle 30s infinite ease-in-out; text-transform: uppercase;
  }
  body.dark-mode .sachin-grid-cell {
    animation: none !important; color: rgba(255, 255, 255, 0.36) !important; opacity: 1 !important;
  }

  .sachin-bottom-tag {
    position: fixed; bottom: 6px; left: 10px; z-index: 100000;
    background: rgba(16, 29, 49, 0.92); backdrop-filter: blur(8px);
    border: 1px solid rgba(197, 161, 91, 0.5); padding: 4px 10px;
    border-radius: 20px; font-size: 11px; font-weight: 800; letter-spacing: 1px; pointer-events: auto;
  }
  .sachin-bottom-tag a { color: #f7e6bd; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- Watermark Overlay -->
<div class="sachin-grid-watermark" aria-hidden="true">
  <div class="sachin-grid-cell">SACHIN SHARMA</div>

  <div class="sachin-grid-cell">SACHIN SHARMA</div>
  <div class="sachin-grid-cell">SACHIN SHARMA</div>
  <div class="sachin-grid-cell">SACHIN SHARMA</div>
  <div class="sachin-grid-cell">SACHIN SHARMA</div>
</div>

<div class="sachin-bottom-tag">
  <a href="https://t.me/Avigat1210" target="_blank" rel="noopener">
    <span>🥀</span> <b>SACHIN SHARMA · @Avigat1210</b>
  </a>
</div>

<!-- स्प्लैश स्क्रीन लोडिंग एनिमेशन -->
<div id="splashScreen">
  <img src="https://files.catbox.moe/84df9j.jpg" alt="SACHIN SHARMA LOGO">
  <h2 style="font-size:18px; font-family:Georgia,serif; letter-spacing:1px; color:#f7e6bd;">SACHIN SHARMA PORTAL</h2>
  <div class="loader-bar"></div>
</div>

<!-- Full Screen Layout -->
<div class="fullscreen-container">
  <!-- Minimal Top Bar with Owner Info & Dark Mode -->
  <div class="top-brand-bar">
    <div style="font-weight: bold; letter-spacing: 0.5px;">𝚾 𝚫 𝚬 𝚸 · <b>SACHIN SHARMA</b> UPSC HUB</div>
    <div style="display: flex; gap: 10px; align-items: center;">
      <a href="https://t.me/Avigat1210" target="_blank"><span>🥀</span> @Avigat1210</a>
      <button onclick="toggleDark()">🌙 मोड</button>
    </div>
  </div>

  <!-- Fullscreen Host Frame -->
  <div class="fullscreen-iframe-box">
    <iframe src="https://alert-pink-rmqj4pzl.edgeone.dev/" title="Live Practice Hub Fullscreen"></iframe>
  </div>
</div>

<script>
  // 1. स्प्लैश स्क्रीन 1.2 सेकंड बाद गायब होगी और फुल स्क्रीन साइट लोड हो जाएगी
  window.addEventListener('load', () => {
    setTimeout(() => {
      const splash = document.getElementById('splashScreen');
      splash.style.opacity = '0';
      setTimeout(() => splash.classList.add('hidden'), 500);
    }, 1200);
  });

  // 2. डार्क मोड टॉगल
  function toggleDark() {
    document.body.classList.toggle('dark-mode');
    localStorage.setItem('dark', document.body.classList.contains('dark-mode') ? '1' : '0');
  }
  if(localStorage.getItem('dark') === '1') document.body.classList.add('dark-mode');
</script>
</body>
</html>
